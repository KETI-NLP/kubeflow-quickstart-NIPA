apiVersion: v1
kind: Pod
metadata:
  name: pvc-upload-vlm-dpo-qwen3-5
  namespace: gpu-workspace
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  nodeSelector:
    example.com/gpu-pool: YOUR_GPU_NODE_POOL
  containers:
    - name: main
      image: ubuntu:22.04
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: storage-volume
          mountPath: /data
  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: training-pvc
