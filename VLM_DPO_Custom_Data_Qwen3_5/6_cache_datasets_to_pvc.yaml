apiVersion: v1
kind: Pod
metadata:
  name: vlm-dpo-cache-to-pvc
  namespace: gpu-workspace
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  restartPolicy: Never
  nodeSelector:
    example.com/gpu-pool: YOUR_GPU_NODE_POOL
  imagePullSecrets:
    - name: registry-credentials
  containers:
    - name: cache
      image: registry.example.com/vlm-dpo-qwen3_5:ib
      imagePullPolicy: Always
      resources:
        requests:
          cpu: "16"
          memory: "256Gi"
        limits:
          cpu: "16"
          memory: "256Gi"
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import time

          from huggingface_hub import snapshot_download
          from mlx.sdk.data import load_dataset, login

          DATASETS = [
              # "YOUR_WORKSPACE/data_kr_obj_img_4_hallu_txt_dpo_hf",
              # "YOUR_WORKSPACE/data_kr_obj_img_5_hallu_wr_txt_dpo_hf",
              "YOUR_WORKSPACE/data_kr_heri_vqa_dpo_hf",
          ]
          OUTPUT_DIR = "/data/vlm_dpo_qwen3_5_dataset"
          MAX_RETRIES = 10

          api_key = os.environ.get("MLX_APIKEY") or os.environ.get("MLXP_API_KEY")
          endpoint = os.environ.get("MLX_ENDPOINT_URL") or os.environ.get("MLXP_ENDPOINT_URL")
          login(api_key, endpoint)

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def load_local_snapshot(path):
              candidates = [path]
              wildcard_candidate = os.path.join(path, "*")
              if glob.glob(wildcard_candidate):
                  candidates.append(wildcard_candidate)

              last_error = None
              for candidate in candidates:
                  try:
                      return load_dataset(candidate)
                  except Exception as exc:
                      last_error = exc
              raise RuntimeError(
                  f"Failed to open downloaded dataset at {path}. "
                  f"Tried candidates={candidates}. Last error: {type(last_error).__name__}: {last_error}"
              )

          for repo_id in DATASETS:
              dataset_name = repo_id.split("/")[-1]
              save_path = os.path.join(OUTPUT_DIR, dataset_name)
              tmp_save_path = f"{save_path}.tmp"

              if os.path.exists(save_path):
                  print(f"SKIP {repo_id} -> {save_path} already exists", flush=True)
                  continue

              last_error = None
              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      print(
                          f"SNAPSHOT_DOWNLOADING {repo_id} -> {save_path} (attempt {attempt}/{MAX_RETRIES})",
                          flush=True,
                      )
                      snapshot_download(
                          repo_id=repo_id,
                          repo_type="dataset",
                          local_dir=tmp_save_path,
                          max_workers=16,
                      )
                      ds = load_local_snapshot(tmp_save_path)
                      os.rename(tmp_save_path, save_path)
                      train = ds["train"] if hasattr(ds, "keys") and "train" in ds else ds
                      print(
                          f"DONE {repo_id} train_samples={len(train):,} columns={train.column_names}",
                          flush=True,
                      )
                      break
                  except Exception as exc:
                      last_error = exc
                      wait_seconds = min(8, 2 ** (attempt - 1))
                      print(
                          f"RETRY {repo_id} failed with {type(exc).__name__}: {exc}. "
                          f"Sleeping {wait_seconds}s before retry.",
                          flush=True,
                      )
                      if attempt == MAX_RETRIES:
                          raise
                      time.sleep(wait_seconds)

          print("PVC dataset cache completed successfully.", flush=True)
          PY
      env:
        - name: MLXP_API_KEY
          valueFrom:
            secretKeyRef:
              name: mlxp-credentials
              key: api-key
        - name: MLXP_ENDPOINT_URL
          value: https://kpb4r.mlxp.ncloud.com/
        - name: MLX_APIKEY
          valueFrom:
            secretKeyRef:
              name: mlxp-credentials
              key: api-key
        - name: MLX_ENDPOINT_URL
          value: https://kpb4r.mlxp.ncloud.com/
      volumeMounts:
        - name: storage-volume
          mountPath: /data
  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: training-pvc
