apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: vlm-dpo-qwen3-5-from-sft-wo-kr-heri-vqa
  namespace: gpu-workspace
spec:
  elasticPolicy:
    rdzvId: vlm-dpo-qwen3-5-from-sft-wo-kr-heri-vqa
    rdzvBackend: c10d
    minReplicas: 8
    maxReplicas: 8
    nProcPerNode: 8
  pytorchReplicaSpecs:
    Worker:
      replicas: 16
      restartPolicy: Never
      template:
        spec:
          nodeSelector:
            example.com/gpu-pool: YOUR_GPU_NODE_POOL
          imagePullSecrets:
            - name: registry-credentials
          containers:
            - name: pytorch
              image: registry.example.com/vlm-dpo-qwen3_5:ib
              imagePullPolicy: Always
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
              command: ["bash", "-c"]
              args:
                - >
                  ulimit -l unlimited &&
                  torchrun --nnodes ${PET_NNODES}
                  --nproc_per_node ${PET_NPROC_PER_NODE}
                  --rdzv_id ${PET_RDZV_ID}
                  --rdzv_backend ${PET_RDZV_BACKEND}
                  --rdzv_endpoint ${PET_RDZV_ENDPOINT}
                  /app/3_vlm_dpo_distributed.py
                  --model_name /data/checkpoints/qwen3_5_9b_multimodal_sft_lr_1e-5/checkpoint-300
                  --processor_name /data/checkpoints/qwen3_5_9b_multimodal_sft_lr_1e-5
                  --data_path YOUR_WORKSPACE/data_kr_obj_img_4_hallu_txt_dpo_hf,YOUR_WORKSPACE/data_kr_obj_img_5_hallu_wr_txt_dpo_hf
                  --output_path /data/checkpoints/qwen3_5_9b_multimodal_sft_dpo_wo_heri_vqa_dpo_lr_5e-7
                  --logging_dir /data/log/vlm-dpo-qwen3-5-from-sft-wo-kr-heri-vqa-lr-5e-7
                  --per_device_train_batch_size 1
                  --gradient_accumulation_steps 16
                  --learning_rate 5e-7
                  --num_train_epochs 3
                  --save_steps 100
              env:
                - name: HF_HOME
                  value: /data/huggingface_cache
                - name: NCCL_DEBUG
                  value: INFO
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_SOCKET_IFNAME
                  value: "^lo,docker0"
                - name: NCCL_NET_GDR_LEVEL
                  value: "2"
                - name: NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: MLXP_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mlxp-credentials
                      key: api-key
                - name: MLXP_ENDPOINT_URL
                  value: https://kpb4r.mlxp.ncloud.com/
                - name: MLX_APIKEY
                  valueFrom:
                    secretKeyRef:
                      name: mlxp-credentials
                      key: api-key
                - name: MLX_ENDPOINT_URL
                  value: https://kpb4r.mlxp.ncloud.com/
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mlxp-credentials
                      key: api-key
              resources:
                limits:
                  cpu: "64"
                  memory: "1024Gi"
                  nvidia.com/gpu: 8
                requests:
                  cpu: "64"
                  memory: "1024Gi"
                  nvidia.com/gpu: 8
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: "/data"
                  name: storage-volume
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: storage-volume
              persistentVolumeClaim:
                claimName: training-pvc
