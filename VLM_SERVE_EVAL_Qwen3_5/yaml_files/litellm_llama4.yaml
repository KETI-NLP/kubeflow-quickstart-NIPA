model_parameters:
  model_name: "openai/llama4-scout-17b-instruct"
  provider: "openai"
  base_url: "http://127.0.0.1:4000/v1"
  api_key: "REPLACE_WITH_API_KEY"
  concurrent_requests: 4
  verbose: true
  api_max_retry: 8       
  api_retry_sleep: 5.0   
  api_retry_multiplier: 2.0
  timeout: 600.0
  max_model_length: 8192  # 서버/엔드포인트에서 제한하는 최대 길이 (실제 모델은 더 긴 컨텍스트 지원 가능하지만 서버 설정에 맞춤)
  generation_parameters:
    temperature: 0.0
    top_p: 1.0 