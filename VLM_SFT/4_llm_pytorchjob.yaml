apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: vlm-sft-dist
  namespace: gpu-workspace
spec:
  elasticPolicy:
    rdzvId: vlm-sft
    rdzvBackend: c10d
    minReplicas: 8
    maxReplicas: 8
    nProcPerNode: 8
  pytorchReplicaSpecs:
    Worker:
      replicas: 8
      restartPolicy: Never
      template:
        spec:
          nodeSelector:
            example.com/gpu-pool: YOUR_GPU_NODE_POOL
          imagePullSecrets:
            - name: registry-credentials
          containers:
            - name: pytorch
              # 커스텀으로 빌드한 linux/amd64 x86_64 기반 이미지 적용 (본인의 레지스트리 경로에 맞춰 변경 필요)
              image: registry.example.com/custom-vlm-sft:latest
              imagePullPolicy: Always
              command: ["bash", "-c"]
              args:
                - >
                  torchrun --nnodes ${PET_NNODES}
                  --nproc_per_node ${PET_NPROC_PER_NODE}
                  --rdzv_id ${PET_RDZV_ID}
                  --rdzv_backend ${PET_RDZV_BACKEND}
                  --rdzv_endpoint ${PET_RDZV_ENDPOINT}
                  /app/3_vlm_sft_distributed.py
                  --model_name Qwen/Qwen3-VL-8B-Instruct
                  --data_path /data/vlm_sft_dataset
              env:
                - name: HF_HOME
                  value: /data/huggingface_cache
                - name: NCCL_DEBUG
                  value: INFO
              resources:
                limits:
                  cpu: "8"
                  memory: "128Gi"
                  nvidia.com/gpu: 8
                requests:
                  cpu: "8"
                  memory: "128Gi"
                  nvidia.com/gpu: 8
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: "/data"
                  name: storage-volume
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: storage-volume
              persistentVolumeClaim:
                claimName: training-pvc
